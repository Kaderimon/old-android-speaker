// shairport-sync config for the W200 (classic AirPlay audio -> stdout -> W200Pcm)
general =
{
  name = "W200";
  mdns_backend = "tinysvcmdns";
  // only advertise Wi-Fi addresses (not the unused Wi-Fi Direct p2p0 interface)
  interface = "wlan0";
  output_backend = "stdout";
  interpolation = "basic";
  volume_range_db = 50;
  // allow a new sender to take over from the current one
  allow_session_interruption = "yes";
  // give up on a sender that vanished
  session_timeout = 30;
};

sessioncontrol =
{
  session_timeout = 30;
};

// now-playing info (title/artist/album/cover/sender name) for the W200 launcher
metadata =
{
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/data/local/tmp/w200/shairport-metadata";
  pipe_timeout = 5000;
};
